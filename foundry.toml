[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
aevum_testnet = "https://rpc-test.qday.info"

[etherscan]
# Aevum testnet explorer is Blockscout-based; verification is done by
# reading state back through the RPC and linking the explorer pages.
aevum_testnet = { key = "", url = "https://explorer-test.qday.info/api" }
